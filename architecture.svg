<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #172033; }
      .layer { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; rx: 12; }
      .box { fill: #ffffff; stroke: #475569; stroke-width: 1.5; rx: 10; }
      .title { font-size: 18px; font-weight: 700; }
      .small { font-size: 14px; fill: #475569; }
      .label { font-size: 14px; font-weight: 600; fill: #334155; }
      .flow { fill: none; stroke: #334155; stroke-width: 2.2; marker-end: url(#arrow); }
      .return { fill: none; stroke: #0f766e; stroke-width: 2.2; marker-end: url(#arrow); }
      .note { fill: #fff7ed; stroke: #fdba74; stroke-width: 1.2; rx: 8; }
    </style>
  </defs>

  <rect x="18" y="40" width="300" height="310" class="layer"/>
  <rect x="330" y="40" width="250" height="310" class="layer"/>
  <rect x="592" y="40" width="270" height="310" class="layer"/>
  <rect x="874" y="40" width="308" height="310" class="layer"/>

  <text x="168" y="70" text-anchor="middle" class="label">网络与控制层</text>
  <text x="455" y="70" text-anchor="middle" class="label">FPGA处理层</text>
  <text x="727" y="70" text-anchor="middle" class="label">嵌入式控制层</text>
  <text x="1028" y="70" text-anchor="middle" class="label">执行设备层</text>

  <rect x="38" y="100" width="120" height="120" class="box"/>
  <text x="98" y="130" text-anchor="middle" class="title">PC / Web</text>
  <text x="98" y="158" text-anchor="middle" class="small">控制意图</text>
  <text x="98" y="180" text-anchor="middle" class="small">AES / SM4</text>
  <text x="98" y="202" text-anchor="middle" class="small">状态过滤</text>

  <rect x="178" y="100" width="120" height="120" class="box"/>
  <text x="238" y="130" text-anchor="middle" class="title">ESP32</text>
  <text x="238" y="158" text-anchor="middle" class="small">Wi-Fi / UDP</text>
  <text x="238" y="180" text-anchor="middle" class="small">UART透明桥</text>
  <text x="238" y="202" text-anchor="middle" class="small">不处理业务</text>

  <rect x="350" y="100" width="210" height="120" class="box"/>
  <text x="455" y="130" text-anchor="middle" class="title">RX50T FPGA</text>
  <text x="455" y="158" text-anchor="middle" class="small">解密与CRC / sequence</text>
  <text x="455" y="180" text-anchor="middle" class="small">车控事务与错误处理</text>
  <text x="455" y="202" text-anchor="middle" class="small">STATUS校验并加密回传</text>

  <rect x="612" y="100" width="230" height="120" class="box"/>
  <text x="727" y="130" text-anchor="middle" class="title">STM32</text>
  <text x="727" y="158" text-anchor="middle" class="small">CONTROL解析</text>
  <text x="727" y="180" text-anchor="middle" class="small">PWM / GPIO电机控制</text>
  <text x="727" y="202" text-anchor="middle" class="small">250 ms失联停车与STATUS</text>

  <rect x="894" y="100" width="130" height="120" class="box"/>
  <text x="959" y="142" text-anchor="middle" class="title">四轮电机</text>
  <text x="959" y="174" text-anchor="middle" class="small">运动执行</text>
  <text x="959" y="196" text-anchor="middle" class="small">最终STOP</text>

  <rect x="1040" y="100" width="122" height="120" class="note"/>
  <text x="1101" y="136" text-anchor="middle" class="title">传感接口</text>
  <text x="1101" y="168" text-anchor="middle" class="small">STATUS字段保留</text>
  <text x="1101" y="192" text-anchor="middle" class="small">实体未安装</text>

  <path d="M 158 145 L 178 145" class="flow"/>
  <path d="M 298 145 L 350 145" class="flow"/>
  <path d="M 560 145 L 612 145" class="flow"/>
  <path d="M 842 145 L 894 145" class="flow"/>

  <text x="168" y="132" text-anchor="middle" class="small">UDP</text>
  <text x="324" y="132" text-anchor="middle" class="small">2 Mbps UART</text>
  <text x="586" y="132" text-anchor="middle" class="small">115200 UART</text>

  <path d="M 727 250 L 727 286 L 455 286 L 455 250" class="return"/>
  <path d="M 455 286 L 238 286 L 238 250" class="return"/>
  <path d="M 238 286 L 98 286 L 98 250" class="return"/>
  <text x="588" y="278" text-anchor="middle" class="small">STATUS → 校验 / 加密 CAR_RSP → UDP → accepted snapshot</text>

  <text x="600" y="395" text-anchor="middle" class="small">正向：控制与密文请求　｜　返回：实际状态与加密响应　｜　安全边界：网络、密码事务、物理执行分层</text>
</svg>
