<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #172033; }
      .group { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; rx: 14; }
      .box { fill: #ffffff; stroke: #475569; stroke-width: 1.7; rx: 10; }
      .title { font-size: 20px; font-weight: 700; }
      .small { font-size: 14px; fill: #475569; }
      .label { font-size: 15px; font-weight: 600; fill: #334155; }
      .flow { fill: none; stroke: #334155; stroke-width: 2.3; marker-end: url(#arrow); }
      .return { fill: none; stroke: #0f766e; stroke-width: 2.3; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="18" y="34" width="255" height="286" class="group"/>
  <rect x="287" y="34" width="210" height="286" class="group"/>
  <rect x="511" y="34" width="270" height="286" class="group"/>
  <rect x="795" y="34" width="220" height="286" class="group"/>
  <rect x="1029" y="34" width="153" height="286" class="group"/>

  <text x="145" y="64" text-anchor="middle" class="label">控制与状态层</text>
  <text x="392" y="64" text-anchor="middle" class="label">无线通信层</text>
  <text x="646" y="64" text-anchor="middle" class="label">安全事务层</text>
  <text x="905" y="64" text-anchor="middle" class="label">嵌入式执行层</text>
  <text x="1105" y="64" text-anchor="middle" class="label">物理执行</text>

  <rect x="45" y="104" width="200" height="126" class="box"/>
  <text x="145" y="138" text-anchor="middle" class="title">PC控制端</text>
  <text x="145" y="168" text-anchor="middle" class="small">请求构造与加密</text>
  <text x="145" y="191" text-anchor="middle" class="small">响应解密与完整校验</text>
  <text x="145" y="214" text-anchor="middle" class="small">更新已确认设备状态</text>

  <rect x="310" y="104" width="164" height="126" class="box"/>
  <text x="392" y="138" text-anchor="middle" class="title">ESP32</text>
  <text x="392" y="168" text-anchor="middle" class="small">Wi-Fi / UDP</text>
  <text x="392" y="191" text-anchor="middle" class="small">UART透明桥接</text>
  <text x="392" y="214" text-anchor="middle" class="small">不维护业务状态</text>

  <rect x="536" y="104" width="220" height="126" class="box"/>
  <text x="646" y="138" text-anchor="middle" class="title">Artix-7 FPGA</text>
  <text x="646" y="168" text-anchor="middle" class="small">AES / SM4参考核心接口</text>
  <text x="646" y="191" text-anchor="middle" class="small">操作码 / CRC / 序列号检查</text>
  <text x="646" y="214" text-anchor="middle" class="small">车控事务与响应处理</text>

  <rect x="818" y="104" width="174" height="126" class="box"/>
  <text x="905" y="138" text-anchor="middle" class="title">STM32</text>
  <text x="905" y="168" text-anchor="middle" class="small">CONTROL解析</text>
  <text x="905" y="191" text-anchor="middle" class="small">PWM / GPIO控制</text>
  <text x="905" y="214" text-anchor="middle" class="small">超时失联停车与STATUS</text>

  <rect x="1050" y="104" width="110" height="126" class="box"/>
  <text x="1105" y="151" text-anchor="middle" class="title">四轮电机</text>
  <text x="1105" y="184" text-anchor="middle" class="small">运动执行</text>
  <text x="1105" y="207" text-anchor="middle" class="small">最终STOP</text>

  <path d="M 245 150 L 310 150" class="flow"/>
  <path d="M 474 150 L 536 150" class="flow"/>
  <path d="M 756 150 L 818 150" class="flow"/>
  <path d="M 992 150 L 1050 150" class="flow"/>

  <text x="277" y="137" text-anchor="middle" class="small">Wi-Fi / UDP</text>
  <text x="505" y="137" text-anchor="middle" class="small">UART</text>
  <text x="787" y="137" text-anchor="middle" class="small">CONTROL UART</text>

  <path d="M 905 254 L 905 284 L 646 284 L 646 254" class="return"/>
  <path d="M 646 284 L 392 284 L 392 254" class="return"/>
  <path d="M 392 284 L 145 284 L 145 254" class="return"/>
  <text x="525" y="276" text-anchor="middle" class="small">STATUS → 校验与加密响应 → UDP → 已确认状态</text>

  <text x="600" y="372" text-anchor="middle" class="small">正向：控制请求　｜　返回：执行端实际状态　｜　安全边界：网络接入、密码事务与物理执行分层</text>
</svg>
